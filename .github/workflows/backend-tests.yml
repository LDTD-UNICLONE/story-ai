name: Backend tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.7"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - name: Lint
        run: .venv/bin/ruff check app tests scripts --no-cache
      - name: Non-database tests
        env:
          RUN_DB_INTEGRATION_TESTS: "0"
          RUN_REDIS_INTEGRATION_TESTS: "0"
        run: .venv/bin/pytest -m 'not integration' -q -p no:cacheprovider --junitxml=test-results/unit.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: story_ai_ci_test
          POSTGRES_USER: story_ai_test
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U story_ai_test -d story_ai_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_ARTIFACT_DIR: test-results/queue
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.7"
          python-version: "3.12"
          enable-cache: true
      - name: Install Redis executable
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: uv sync --extra dev --frozen
      - name: PostgreSQL migrations and real queue recovery
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://story_ai_test:ci-test-password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/story_ai_ci_test
        run: >-
          .venv/bin/python scripts/run_integration_tests.py --with-redis
          --tb=short --durations=10 --junitxml=test-results/integration.xml
      - name: Upload reports and process logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
