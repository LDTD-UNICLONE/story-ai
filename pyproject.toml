[project]
name = "story-ai-backend"
version = "0.1.0"
description = "FastAPI backend scaffold with PostgreSQL, Redis, Celery, Alembic, and OSS."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5,<2.0",
    "aliyun-python-sdk-core>=2.16.0",
    "asyncpg>=0.29.0",
    "celery>=5.4.0",
    "cryptography>=3.0.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.115.0",
    "greenlet>=3.1.0",
    "httpx>=0.27.2",
    "nh3>=0.3.6",
    "oss2>=2.18.6",
    "psycopg[binary]>=3.2.1",
    "pwdlib[argon2]>=0.3.0,<1.0",
    "PyJWT>=2.9.0",
    "pydantic-settings>=2.5.2",
    "python-multipart>=0.0.31",
    "redis>=5.1.1",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "uvicorn[standard]>=0.30.6",
    "volcengine-python-sdk[ark]>=1.0.0",
    "pypdf>=5.0.0",
    "pyjianyingdraft==0.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.8",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "httpx2>=2.0.0,<3.0",
]

monitor = [
    "flower>=2.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: tests that require a real PostgreSQL connection",
]
